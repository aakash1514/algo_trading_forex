# Laptop-only addition to docker-compose.prod.yml (item 13's local production run): there is no AWS
# instance role on a laptop, so backtest results go to a MinIO container instead of S3. Nothing else
# changes; MinIO publishes no port either.
#
#   docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.local.yml --env-file infra/.env.local-prod up -d
services:
  minio:
    restart: unless-stopped
    # minio/minio is no longer anonymously pullable; this release runs only where the image is cached
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?}
    volumes:
      - minio_data:/data
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  ws-gateway:
    environment:
      STORAGE: minio
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USER: ${MINIO_USER:?}
      MINIO_PASS: ${MINIO_PASS:?}
    depends_on:
      minio: { condition: service_healthy }

volumes:
  minio_data:
