
services:

  # ─── DATABASE ───────────────────────────────
  timescaledb:
      image: timescale/timescaledb:2.27.0-pg16
      container_name: forexedge_tsdb
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_HOST_AUTH_METHOD: md5
        POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=trust"
      ports:
        - "15432:5432"
      volumes:
        - tsdb_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 10s
        timeout: 5s
        retries: 5

  # ─── CACHE + PUB/SUB ────────────────────────
  redis:
    image: redis:7.4.9-alpine
    container_name: forexedge_redis
    command: redis-server --requirepass ${REDIS_PASS} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ─── MESSAGE QUEUE ───────────────────────────
  kafka:
    image: apache/kafka:4.2.0
    container_name: forexedge_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── OBJECT STORAGE ──────────────────────────
  minio:
    # minio/minio is no longer anonymously pullable from Docker Hub or quay.io;
    # this release works only where the image is already cached locally.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: forexedge_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    volumes:
      - minio_data:/data

  # ─── MONITORING ──────────────────────────────
  prometheus:
    image: prom/prometheus:v3.11.3
    container_name: forexedge_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: forexedge_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  tsdb_data:
  redis_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data: